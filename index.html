<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caelora — World Map</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Georgia, serif;
        }

        /* Map viewing area */
        #map-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            position: relative;
        }

        #map-container:active {
            cursor: grabbing;
        }

        /* The map itself */
        #map {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: auto;
            transform-origin: 0 0;
            user-select: none;
            pointer-events: none;
        }

        /* Controls */
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 5px;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background: rgba(70, 70, 70, 0.95);
        }

        /* Title */
        #title {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 10;
            color: white;
            background: rgba(20, 20, 20, 0.8);
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 22px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div id="controls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">−</button>
        <button id="reset">⌂</button>
    </div>

    <div id="title">
        Caelora
    </div>

    <div id="map-container">
        <img id="map" src="./caelora.svg" alt="Map of Caelora">
    </div>

    <script>

        const container = document.getElementById("map-container");
        const map = document.getElementById("map");

        let scale = 1;
        let x = 0;
        let y = 0;

        let dragging = false;
        let startX = 0;
        let startY = 0;

        function updateMap() {
            map.style.transform =
                `translate(${x}px, ${y}px) scale(${scale})`;
        }

        /* Zoom buttons */

        document.getElementById("zoomIn").addEventListener("click", function () {
            scale *= 1.25;
            updateMap();
        });

        document.getElementById("zoomOut").addEventListener("click", function () {
            scale /= 1.25;

            if (scale < 0.2) {
                scale = 0.2;
            }

            updateMap();
        });

        /* Reset button */

        document.getElementById("reset").addEventListener("click", function () {
            scale = 1;
            x = 0;
            y = 0;
            updateMap();
        });

        /* Mouse wheel zoom */

        container.addEventListener("wheel", function (event) {

            event.preventDefault();

            if (event.deltaY < 0) {
                scale *= 1.15;
            } else {
                scale /= 1.15;
            }

            if (scale < 0.2) {
                scale = 0.2;
            }

            if (scale > 8) {
                scale = 8;
            }

            updateMap();

        }, { passive: false });


        /* Dragging */

        container.addEventListener("mousedown", function (event) {

            dragging = true;

            startX = event.clientX - x;
            startY = event.clientY - y;

        });

        window.addEventListener("mouseup", function () {
            dragging = false;
        });

        window.addEventListener("mousemove", function (event) {

            if (!dragging) return;

            x = event.clientX - startX;
            y = event.clientY - startY;

            updateMap();

        });


        /* Touchscreen support */

        let touchStartX = 0;
        let touchStartY = 0;

        container.addEventListener("touchstart", function (event) {

            if (event.touches.length !== 1) return;

            touchStartX = event.touches[0].clientX - x;
            touchStartY = event.touches[0].clientY - y;

        });

        container.addEventListener("touchmove", function (event) {

            if (event.touches.length !== 1) return;

            x = event.touches[0].clientX - touchStartX;
            y = event.touches[0].clientY - touchStartY;

            updateMap();

        });

    </script>

</body>
</html>
