<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caelora — World Map</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #map-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #111;
        }

        #map {
            display: block;
            width: 1920px;
            height: auto;
        }
    </style>
</head>

<body>

<div id="map-container">
    <object
        id="map"
        type="image/svg+xml"
        data="./caelora.svg">
    </object>
</div>

</body>
</html>
