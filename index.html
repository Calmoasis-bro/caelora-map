<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Caelora — Interactive Map</title>


<style>

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


#map-container {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    cursor: grab;

    background: #111;
}


#map-container.dragging {

    cursor: grabbing;
}


/*
    The SVG itself.

    The SVG is inserted directly into this element,
    allowing JavaScript to access all of Azgaar's
    existing layers.
*/

#map {

    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    transform-origin: 0 0;

    user-select: none;

    pointer-events: none;
}


/* ---------------------------------------------------------
   CONTROLS
--------------------------------------------------------- */

#controls {

    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 100;

    display: flex;

    flex-direction: column;

    gap: 6px;
}


#controls button {

    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 6px;

    background: rgba(20,20,20,0.8);

    color: white;

    font-size: 22px;

    cursor: pointer;

    backdrop-filter: blur(4px);
}


#controls button:hover {

    background: rgba(60,60,60,0.9);
}


/* ---------------------------------------------------------
   ZOOM DISPLAY
--------------------------------------------------------- */

#zoom-level {

    position: absolute;

    bottom: 15px;
    left: 15px;

    z-index: 100;

    padding: 6px 10px;

    color: white;

    background: rgba(20,20,20,0.75);

    border-radius: 5px;

    font-size: 13px;

    pointer-events: none;
}

</style>

</head>


<body>


<div id="map-container">


    <!--
        The actual SVG will be loaded into here.
    -->

    <div id="map"></div>


    <div id="controls">

        <button id="zoom-in">
            +
        </button>

        <button id="zoom-out">
            −
        </button>

        <button id="reset">
            ⌂
        </button>

    </div>


    <div id="zoom-level">
        100%
    </div>


</div>



<script>


// ============================================================
// BASIC VARIABLES
// ============================================================

const container =
    document.getElementById("map-container");

const map =
    document.getElementById("map");

const zoomText =
    document.getElementById("zoom-level");


// ============================================================
// AZGAAR MAP SIZE
// ============================================================

const MAP_WIDTH = 1920;

const MAP_HEIGHT = 1080;


// ============================================================
// ZOOM
// ============================================================

const MAX_ZOOM = 25;

let MIN_ZOOM = 0.1;

let scale = 1;


// ============================================================
// POSITION
// ============================================================

let posX = 0;

let posY = 0;


// ============================================================
// DRAGGING
// ============================================================

let dragging = false;

let dragStartX = 0;

let dragStartY = 0;

let startPosX = 0;

let startPosY = 0;


// ============================================================
// BURG CONFIGURATION
// ============================================================
//
// These control when each type of settlement becomes visible.
//
// These are deliberately separate so we can tune them later.
// ============================================================

const BURG_LEVELS = {

    capital: 1.2,

    city: 1.5,

    town: 2.0,

    fort: 2.0,

    village: 2.8

};


// ============================================================
// BURG SIZES
// ============================================================
//
// Target size in SCREEN pixels.
//
// The SVG's original burgs are tiny because Azgaar normally
// controls their appearance through its own zoom system.
// ============================================================

const BURG_SIZES = {

    capital: 14,

    city: 11,

    town: 8,

    fort: 9,

    village: 6

};


// ============================================================
// LOAD THE SVG
// ============================================================

async function loadMap() {

    try {

        const response =
            await fetch("caelora.svg");


        if (!response.ok) {

            throw new Error(
                "Could not load caelora.svg"
            );
        }


        const svgText =
            await response.text();


        /*
            Parse the SVG.

            This gives us a real SVG DOM rather than an
            <object> whose internal document we have to access.
        */

        const parser =
            new DOMParser();


        const svgDocument =
            parser.parseFromString(
                svgText,
                "image/svg+xml"
            );


        const svg =
            svgDocument.documentElement;


        /*
            Put the SVG directly into the page.
        */

        map.appendChild(
            document.importNode(
                svg,
                true
            )
        );


        /*
            Make sure the SVG retains the original
            1920 × 1080 coordinate system.
        */

        const svgElement =
            map.querySelector("svg");


        svgElement.setAttribute(
            "width",
            MAP_WIDTH
        );


        svgElement.setAttribute(
            "height",
            MAP_HEIGHT
        );


        svgElement.style.display =
            "block";


        /*
            Now that the SVG exists in the page,
            we can directly manipulate its layers.
        */

        setupBurgs();


        calculateMinZoom();


        scale =
            MIN_ZOOM;


        centerMap();


        updateMap();


    }

    catch (error) {

        console.error(
            "Caelora map failed to load:",
            error
        );

        map.innerHTML =
            "<p style='color:white;padding:20px'>" +
            "Could not load caelora.svg." +
            "</p>";
    }
}


// ============================================================
// FIND BURG LAYERS
// ============================================================

function setupBurgs() {

    const svg =
        map.querySelector("svg");


    if (!svg) {
        return;
    }


    /*
        These are the actual groups contained in your SVG.
    */

    const types = [

        "capital",
        "city",
        "town",
        "fort",
        "village"

    ];


    types.forEach(function(type) {

        const group =
            svg.querySelector(
                "#" + type
            );


        if (!group) {

            console.warn(
                "Could not find burg group:",
                type
            );

            return;
        }


        /*
            Store the original transforms.

            This is extremely important.

            We never destroy Azgaar's original coordinates.
        */

        const uses =
            group.querySelectorAll(
                "use"
            );


        uses.forEach(function(use) {

            const transform =
                use.getAttribute(
                    "transform"
                );


            if (transform) {

                use.dataset.originalTransform =
                    transform;
            }

        });

    });


    /*
        Find the label layers too.

        Azgaar stores these separately from the icons.
    */

    const labelGroups =
        svg.querySelectorAll(
            '[id^="labels-"]'
        );


    labelGroups.forEach(function(group) {

        group.dataset.caeloraLabels =
            "true";

    });


    console.log(
        "Caelora burg system loaded."
    );

}


// ============================================================
// CALCULATE MINIMUM ZOOM
// ============================================================

function calculateMinZoom() {

    const width =
        container.clientWidth;

    const height =
        container.clientHeight;


    const scaleX =
        width / MAP_WIDTH;


    const scaleY =
        height / MAP_HEIGHT;


    MIN_ZOOM =
        Math.max(
            scaleX,
            scaleY
        );


    MIN_ZOOM =
        Math.max(
            MIN_ZOOM,
            0.15
        );
}


// ============================================================
// CENTER MAP
// ============================================================

function centerMap() {

    const width =
        container.clientWidth;

    const height =
        container.clientHeight;


    const scaledWidth =
        MAP_WIDTH * scale;


    const scaledHeight =
        MAP_HEIGHT * scale;


    posX =
        (
            width -
            scaledWidth
        ) / 2;


    posY =
        (
            height -
            scaledHeight
        ) / 2;
}


// ============================================================
// KEEP MAP ON SCREEN
// ============================================================

function constrainPosition() {

    const width =
        container.clientWidth;

    const height =
        container.clientHeight;


    const scaledWidth =
        MAP_WIDTH * scale;


    const scaledHeight =
        MAP_HEIGHT * scale;


    if (
        scaledWidth <= width
    ) {

        posX =
            (
                width -
                scaledWidth
            ) / 2;

    }

    else {

        const minX =
            width -
            scaledWidth;


        posX =
            Math.max(
                minX,
                Math.min(
                    posX,
                    0
                )
            );
    }


    if (
        scaledHeight <= height
    ) {

        posY =
            (
                height -
                scaledHeight
            ) / 2;

    }

    else {

        const minY =
            height -
            scaledHeight;


        posY =
            Math.max(
                minY,
                Math.min(
                    posY,
                    0
                )
            );
    }
}


// ============================================================
// UPDATE MAP
// ============================================================

function updateMap() {

    constrainPosition();


    map.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;


    zoomText.textContent =
        Math.round(
            scale * 100
        ) + "%";


    updateBurgVisibility();
}


// ============================================================
// UPDATE BURGS
// ============================================================

function updateBurgVisibility() {

    const svg =
        map.querySelector("svg");


    if (!svg) {
        return;
    }


    /*
        Process each settlement category.
    */

    Object.keys(
        BURG_LEVELS
    ).forEach(function(type) {

        const group =
            svg.querySelector(
                "#" + type
            );


        if (!group) {
            return;
        }


        const showAt =
            BURG_LEVELS[type];


        const targetSize =
            BURG_SIZES[type];


        /*
            Determine whether this category should be visible.
        */

        const visible =
            scale >= showAt;


        group.style.display =
            visible
                ? ""
                : "none";


        if (!visible) {
            return;
        }


        /*
            Get every actual burg icon.
        */

        const uses =
            group.querySelectorAll(
                "use"
            );


        uses.forEach(function(use) {

            const original =
                use.dataset.originalTransform;


            if (!original) {
                return;
            }


            /*
                Extract the original translation.

                Example:

                translate(710.61,947.46) scale(0.2)
            */

            const translationMatch =
                original.match(
                    /translate\s*\(\s*([^)]+)\s*\)/
                );


            if (!translationMatch) {
                return;
            }


            const translation =
                translationMatch[1];


            /*
                The SVG icon definitions are approximately
                10 SVG units across.

                Calculate the internal SVG scale required
                to make the icon approximately the desired
                number of screen pixels.
            */

            const internalScale =
                targetSize /
                (
                    10 *
                    scale
                );


            use.setAttribute(
                "transform",
                `translate(${translation}) scale(${internalScale})`
            );

        });

    });


    /*
        -------------------------------------------------------
        BURG LABELS
        -------------------------------------------------------

        The names are stored in separate label groups.

        We reveal them progressively as the user zooms.
    */


    const labelGroups =
        svg.querySelectorAll(
            '[id^="labels-"]'
        );


    labelGroups.forEach(function(group) {

        /*
            Capital labels appear first.
        */

        if (
            group.id ===
            "labels-capital"
        ) {

            group.style.display =
                scale >= 1.8
                    ? ""
                    : "none";

        }


        /*
            Other settlement labels appear deeper in.
        */

        else {

            group.style.display =
                scale >= 2.5
                    ? ""
                    : "none";
        }

    });

}


// ============================================================
// ZOOM AT POINT
// ============================================================

function zoomAt(
    screenX,
    screenY,
    newScale
) {

    newScale =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                newScale
            )
        );


    const mapX =
        (
            screenX -
            posX
        ) / scale;


    const mapY =
        (
            screenY -
            posY
        ) / scale;


    scale =
        newScale;


    posX =
        screenX -
        mapX *
        scale;


    posY =
        screenY -
        mapY *
        scale;


    updateMap();
}


// ============================================================
// MOUSE WHEEL
// ============================================================

container.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        const rect =
            container.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.25
                : 0.8;


        zoomAt(
            mouseX,
            mouseY,
            scale * factor
        );

    },
    {
        passive: false
    }
);


// ============================================================
// MOUSE DRAG
// ============================================================

container.addEventListener(
    "mousedown",
    function(event) {

        if (
            event.button !== 0
        ) {
            return;
        }


        dragging = true;


        container.classList.add(
            "dragging"
        );


        dragStartX =
            event.clientX;


        dragStartY =
            event.clientY;


        startPosX =
            posX;


        startPosY =
            posY;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }


        posX =
            startPosX +
            (
                event.clientX -
                dragStartX
            );


        posY =
            startPosY +
            (
                event.clientY -
                dragStartY
            );


        updateMap();

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;


        container.classList.remove(
            "dragging"
        );

    }
);


// ============================================================
// TOUCH
// ============================================================

let touchStartX = 0;

let touchStartY = 0;

let touchStartPosX = 0;

let touchStartPosY = 0;

let lastTouchDistance = null;


container.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length === 1
        ) {

            const touch =
                event.touches[0];


            touchStartX =
                touch.clientX;


            touchStartY =
                touch.clientY;


            touchStartPosX =
                posX;


            touchStartPosY =
                posY;


            lastTouchDistance =
                null;

        }

        else if (
            event.touches.length === 2
        ) {

            lastTouchDistance =
                getTouchDistance(
                    event.touches
                );

        }

    },
    {
        passive: false
    }
);


// ============================================================
// TOUCH MOVE
// ============================================================

container.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        if (
            event.touches.length === 1
        ) {

            const touch =
                event.touches[0];


            posX =
                touchStartPosX +
                (
                    touch.clientX -
                    touchStartX
                );


            posY =
                touchStartPosY +
                (
                    touch.clientY -
                    touchStartY
                );


            updateMap();

        }


        else if (
            event.touches.length === 2
        ) {

            const distance =
                getTouchDistance(
                    event.touches
                );


            if (
                lastTouchDistance !== null
            ) {

                const factor =
                    distance /
                    lastTouchDistance;


                const rect =
                    container.getBoundingClientRect();


                const centerX =
                    (
                        event.touches[0].clientX +
                        event.touches[1].clientX
                    ) / 2 -
                    rect.left;


                const centerY =
                    (
                        event.touches[0].clientY +
                        event.touches[1].clientY
                    ) / 2 -
                    rect.top;


                zoomAt(
                    centerX,
                    centerY,
                    scale * factor
                );

            }


            lastTouchDistance =
                distance;

        }

    },
    {
        passive: false
    }
);


// ============================================================
// TOUCH END
// ============================================================

container.addEventListener(
    "touchend",
    function() {

        lastTouchDistance =
            null;

    }
);


// ============================================================
// TOUCH DISTANCE
// ============================================================

function getTouchDistance(
    touches
) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;


    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


// ============================================================
// BUTTONS
// ============================================================

document.getElementById(
    "zoom-in"
).addEventListener(
    "click",
    function() {

        const x =
            container.clientWidth / 2;


        const y =
            container.clientHeight / 2;


        zoomAt(
            x,
            y,
            scale * 1.4
        );

    }
);


document.getElementById(
    "zoom-out"
).addEventListener(
    "click",
    function() {

        const x =
            container.clientWidth / 2;


        const y =
            container.clientHeight / 2;


        zoomAt(
            x,
            y,
            scale * 0.7
        );

    }
);


// ============================================================
// RESET
// ============================================================

document.getElementById(
    "reset"
).addEventListener(
    "click",
    function() {

        calculateMinZoom();


        scale =
            MIN_ZOOM;


        centerMap();


        updateMap();

    }
);


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    function() {

        calculateMinZoom();


        if (
            scale < MIN_ZOOM
        ) {

            scale =
                MIN_ZOOM;

        }


        updateMap();

    }
);


// ============================================================
// START
// ============================================================

loadMap();


</script>

</body>
</html>
