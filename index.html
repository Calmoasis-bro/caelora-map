<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Caelora — Interactive Map</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}


/* =========================================================
   MAP VIEWPORT
   ========================================================= */

#viewport {

  position: fixed;

  inset: 0;

  overflow: hidden;

  cursor: grab;

  touch-action: none;

  background: #111;
}

#viewport.dragging {
  cursor: grabbing;
}


/*
   IMPORTANT:

   The SVG object no longer receives mouse input directly.

   This means the parent viewport receives:

   - dragging
   - mouse wheel
   - touch gestures

   while the SVG remains purely visual.
*/

#mapObject {

  position: absolute;

  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  transform-origin: 0 0;

  user-select: none;

  -webkit-user-drag: none;

  pointer-events: none;
}


/* =========================================================
   CONTROLS
   ========================================================= */

#controls {

  position: fixed;

  z-index: 20;

  top: 14px;
  right: 14px;

  display: flex;

  gap: 6px;

  padding: 6px;

  border-radius: 8px;

  background: rgba(20,20,20,.78);

  backdrop-filter: blur(5px);
}

button {

  width: 38px;
  height: 34px;

  border: 0;

  border-radius: 5px;

  background: #eee;

  color: #111;

  font-size: 19px;

  cursor: pointer;
}

button:hover {
  background: #fff;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {

  position: fixed;

  z-index: 20;

  left: 14px;
  bottom: 14px;

  padding: 5px 8px;

  border-radius: 5px;

  color: #eee;

  background: rgba(20,20,20,.68);

  font: 12px/1.2 system-ui, sans-serif;

  pointer-events: none;
}

</style>
</head>


<body>


<div id="viewport">

  <object
    id="mapObject"
    data="caelora.svg"
    type="image/svg+xml">
  </object>

</div>


<div id="controls">

  <button
    id="zoomOut"
    title="Zoom out">
    −
  </button>

  <button
    id="reset"
    title="Reset view">
    ⌂
  </button>

  <button
    id="zoomIn"
    title="Zoom in">
    +
  </button>

</div>


<div id="status">
  Loading map…
</div>


<script>

(() => {

"use strict";


/* =========================================================
   BASIC MAP SETTINGS
   ========================================================= */

const SVG_W = 1920;
const SVG_H = 1080;

const viewport =
  document.getElementById("viewport");

const mapObject =
  document.getElementById("mapObject");

const status =
  document.getElementById("status");


let svg = null;

let scale = 1;

let minScale = 1;

let x = 0;
let y = 0;


let dragging = false;

let lastX = 0;
let lastY = 0;

let pinchDistance = null;


/*
   requestAnimationFrame is used so rapid mouse-wheel
   movement does not continuously manipulate the SVG DOM.
*/

let raf = 0;

let lastDetailState = "";


/* =========================================================
   ZOOM LEVELS
   =========================================================

   These deliberately create a gradual progression:

   MINIMUM
      State emblems only

   1.25x
      Province emblems

   1.45x
      First burg shields

   1.70x
      City labels

   1.90x
      More burg shields + town labels

   2.30x
      Fort labels

   2.60x
      Most burg shields + village labels

   3.00x
      All burg shields
*/


const DETAIL = {

  provinceEmblems: 1.25,

  cityLabels: 1.65,

  burgEmblems1: 1.45,

  townLabels: 1.90,

  fortLabels: 2.20,

  villageLabels: 2.55,

  burgEmblems2: 1.90,

  burgEmblems3: 2.45,

  burgEmblems4: 3.00

};


/* =========================================================
   BURG SHIELD SIZE
   =========================================================

   The exported Azgaar burg shields are very small.

   Increasing the font size of the burgEmblems group makes
   the existing 1em heraldic <use> elements larger without
   replacing them with fake graphics.

   1.7em keeps them small enough to belong on the map while
   making them considerably more readable.
*/

const BURG_EMBLEM_SIZE = "1.7em";


/* =========================================================
   UTILITY
   ========================================================= */

function clamp(
  value,
  minimum,
  maximum
) {

  return Math.max(
    minimum,
    Math.min(
      maximum,
      value
    )
  );
}


/* =========================================================
   FIND SVG GROUP
   ========================================================= */

function getGroup(id) {

  if (!svg) {
    return null;
  }

  return svg.getElementById(id);
}


/* =========================================================
   SHOW / HIDE SVG GROUP
   ========================================================= */

function setDisplay(
  id,
  visible
) {

  const element =
    getGroup(id);

  if (!element) {
    return;
  }

  element.style.display =
    visible ? "" : "none";
}


/* =========================================================
   BURG SHIELD CACHE
   ========================================================= */

let burgUses = [];


function cacheBurgUses() {

  const group =
    getGroup("burgEmblems");

  if (!group) {

    burgUses = [];

    return;
  }


  burgUses =
    Array.from(
      group.querySelectorAll(
        ":scope > use"
      )
    );
}


/* =========================================================
   MAKE BURG SHIELDS LARGER
   ========================================================= */

function resizeBurgEmblems() {

  const group =
    getGroup("burgEmblems");

  if (!group) {
    return;
  }


  /*
     The individual shields use:

       width="1em"
       height="1em"

     so increasing font-size increases the actual
     rendered heraldry.
  */

  group.style.fontSize =
    BURG_EMBLEM_SIZE;
}


/* =========================================================
   REVEAL A PORTION OF THE BURG SHIELDS
   ========================================================= */

function showBurgFraction(
  fraction
) {

  if (!burgUses.length) {
    return;
  }


  const count =
    Math.ceil(
      burgUses.length *
      fraction
    );


  for (
    let i = 0;
    i < burgUses.length;
    i++
  ) {

    burgUses[i].style.display =
      i < count
        ? ""
        : "none";
  }
}


/* =========================================================
   UPDATE DETAIL LEVEL
   ========================================================= */

function updateDetailLayers() {

  if (!svg) {
    return;
  }


  const s = scale;


  let detailState;


  if (
    s <
    DETAIL.burgEmblems1
  ) {

    detailState = "minimum";

  } else if (
    s <
    DETAIL.burgEmblems2
  ) {

    detailState = "low";

  } else if (
    s <
    DETAIL.burgEmblems3
  ) {

    detailState = "medium";

  } else if (
    s <
    DETAIL.burgEmblems4
  ) {

    detailState = "high";

  } else {

    detailState = "maximum";
  }


  /*
     If we haven't crossed a threshold,
     don't touch the SVG.

     This is important for performance.
  */

  if (
    detailState ===
    lastDetailState
  ) {

    return;
  }


  lastDetailState =
    detailState;


  /* =======================================================
     STATE EMBLEMS

     ALWAYS VISIBLE.

     These are the only emblems visible at minimum zoom.
     ======================================================= */

  setDisplay(
    "stateEmblems",
    true
  );


  /* =======================================================
     PROVINCE EMBLEMS

     Hidden at minimum zoom.
     ======================================================= */

  setDisplay(
    "provinceEmblems",
    s >= DETAIL.provinceEmblems
  );


  /* =======================================================
     BURG ICONS

     ALWAYS HIDDEN.

     This removes:

       white settlement circles
       white port circles
       anchor symbols
     ======================================================= */

  setDisplay(
    "burgIcons",
    false
  );


  /* =======================================================
     LARGE LABELS

     ======================================================= */

  setDisplay(
    "labels-state",
    true
  );

  setDisplay(
    "labels-province",
    true
  );

  setDisplay(
    "labels-capital",
    true
  );


  /* =======================================================
     CITY LABELS
     ======================================================= */

  setDisplay(
    "labels-city",
    s >= DETAIL.cityLabels
  );


  /* =======================================================
     TOWN LABELS
     ======================================================= */

  setDisplay(
    "labels-town",
    s >= DETAIL.townLabels
  );


  /* =======================================================
     FORT LABELS
     ======================================================= */

  setDisplay(
    "labels-fort",
    s >= DETAIL.fortLabels
  );


  /* =======================================================
     VILLAGE LABELS
     ======================================================= */

  setDisplay(
    "labels-village",
    s >= DETAIL.villageLabels
  );


  /* =======================================================
     BURG HERALDRY
     ======================================================= */

  if (
    s <
    DETAIL.burgEmblems1
  ) {

    /*
       No small shields at minimum zoom.
    */

    setDisplay(
      "burgEmblems",
      false
    );

  } else {

    /*
       Enable the real burg heraldry.
    */

    setDisplay(
      "burgEmblems",
      true
    );


    /*
       Gradually reveal more shields.
    */

    if (
      s <
      DETAIL.burgEmblems2
    ) {

      showBurgFraction(
        0.20
      );

    } else if (
      s <
      DETAIL.burgEmblems3
    ) {

      showBurgFraction(
        0.50
      );

    } else if (
      s <
      DETAIL.burgEmblems4
    ) {

      showBurgFraction(
        0.80
      );

    } else {

      showBurgFraction(
        1.00
      );
    }
  }
}


/* =========================================================
   SCHEDULE DETAIL UPDATE
   ========================================================= */

function scheduleDetailUpdate() {

  if (raf) {
    return;
  }


  raf =
    requestAnimationFrame(
      () => {

        raf = 0;

        updateDetailLayers();

        status.textContent =
          `Zoom ${scale.toFixed(2)}×`;
      }
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

  const viewportWidth =
    viewport.clientWidth;

  const viewportHeight =
    viewport.clientHeight;


  minScale =
    Math.min(
      viewportWidth / SVG_W,
      viewportHeight / SVG_H
    );


  if (
    !Number.isFinite(
      minScale
    ) ||
    minScale <= 0
  ) {

    minScale = 0.1;
  }


  scale =
    Math.max(
      scale,
      minScale
    );


  constrain();

  render();
}


/* =========================================================
   CONSTRAIN MAP
   ========================================================= */

function constrain() {

  const viewportWidth =
    viewport.clientWidth;

  const viewportHeight =
    viewport.clientHeight;


  const mapWidth =
    SVG_W * scale;

  const mapHeight =
    SVG_H * scale;


  if (
    mapWidth <=
    viewportWidth
  ) {

    x =
      (
        viewportWidth -
        mapWidth
      ) / 2;

  } else {

    x =
      clamp(
        x,
        viewportWidth -
          mapWidth,
        0
      );
  }


  if (
    mapHeight <=
    viewportHeight
  ) {

    y =
      (
        viewportHeight -
        mapHeight
      ) / 2;

  } else {

    y =
      clamp(
        y,
        viewportHeight -
          mapHeight,
        0
      );
  }
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  mapObject.style.transform =
    `translate3d(${x}px, ${y}px, 0) scale(${scale})`;


  scheduleDetailUpdate();
}


/* =========================================================
   RESET
   ========================================================= */

function resetView() {

  scale =
    minScale;


  x =
    (
      viewport.clientWidth -
      SVG_W * scale
    ) / 2;


  y =
    (
      viewport.clientHeight -
      SVG_H * scale
    ) / 2;


  constrain();

  render();
}


/* =========================================================
   ZOOM AROUND POINTER
   ========================================================= */

function zoomAt(
  factor,
  clientX,
  clientY
) {

  const rect =
    viewport.getBoundingClientRect();


  const pointerX =
    clientX -
    rect.left;

  const pointerY =
    clientY -
    rect.top;


  /*
     Find the map coordinate currently
     beneath the pointer.
  */

  const mapX =
    (
      pointerX -
      x
    ) / scale;

  const mapY =
    (
      pointerY -
      y
    ) / scale;


  const newScale =
    clamp(
      scale * factor,
      minScale,
      8
    );


  /*
     Keep the same map point beneath
     the mouse cursor.
  */

  x =
    pointerX -
    mapX * newScale;

  y =
    pointerY -
    mapY * newScale;


  scale =
    newScale;


  constrain();

  render();
}


/* =========================================================
   MOUSE WHEEL
   ========================================================= */

viewport.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const factor =
      Math.exp(
        -event.deltaY *
        0.0015
      );


    zoomAt(
      factor,
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);


/* =========================================================
   MOUSE DRAGGING
   ========================================================= */

viewport.addEventListener(
  "pointerdown",
  event => {

    /*
       Only left mouse button.
    */

    if (
      event.pointerType ===
        "mouse" &&
      event.button !== 0
    ) {

      return;
    }


    dragging = true;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    viewport.classList.add(
      "dragging"
    );


    try {

      viewport.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}
  }
);


viewport.addEventListener(
  "pointermove",
  event => {

    if (!dragging) {
      return;
    }


    x +=
      event.clientX -
      lastX;

    y +=
      event.clientY -
      lastY;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    constrain();

    render();
  }
);


viewport.addEventListener(
  "pointerup",
  event => {

    dragging = false;


    viewport.classList.remove(
      "dragging"
    );


    try {

      viewport.releasePointerCapture(
        event.pointerId
      );

    } catch (_) {}
  }
);


viewport.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

    viewport.classList.remove(
      "dragging"
    );
  }
);


/* =========================================================
   TOUCH PINCH
   ========================================================= */

viewport.addEventListener(
  "touchstart",
  event => {

    if (
      event.touches.length === 2
    ) {

      const a =
        event.touches[0];

      const b =
        event.touches[1];


      pinchDistance =
        Math.hypot(
          a.clientX -
            b.clientX,

          a.clientY -
            b.clientY
        );
    }

  },
  {
    passive: true
  }
);


viewport.addEventListener(
  "touchmove",
  event => {

    if (
      event.touches.length !== 2 ||
      pinchDistance === null
    ) {

      return;
    }


    const a =
      event.touches[0];

    const b =
      event.touches[1];


    const distance =
      Math.hypot(
        a.clientX -
          b.clientX,

        a.clientY -
          b.clientY
      );


    const factor =
      distance /
      pinchDistance;


    pinchDistance =
      distance;


    zoomAt(
      factor,

      (
        a.clientX +
        b.clientX
      ) / 2,

      (
        a.clientY +
        b.clientY
      ) / 2
    );

  },
  {
    passive: true
  }
);


viewport.addEventListener(
  "touchend",
  event => {

    if (
      event.touches.length <
      2
    ) {

      pinchDistance =
        null;
    }

  },
  {
    passive: true
  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => {

      zoomAt(
        1.5,

        viewport.clientWidth /
          2,

        viewport.clientHeight /
          2
      );
    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => {

      zoomAt(
        1 / 1.5,

        viewport.clientWidth /
          2,

        viewport.clientHeight /
          2
      );
    }
  );


document
  .getElementById("reset")
  .addEventListener(
    "click",
    resetView
  );


/* =========================================================
   LOAD SVG
   ========================================================= */

mapObject.addEventListener(
  "load",
  () => {

    try {

      svg =
        mapObject
          .contentDocument
          .querySelector("svg");


      if (!svg) {

        throw new Error(
          "SVG root not found"
        );
      }


      /*
         Find all real burg heraldry once.
      */

      cacheBurgUses();


      /*
         Increase the size of the actual
         generated burg shields.
      */

      resizeBurgEmblems();


      /*
         INITIAL LOW-ZOOM STATE

         Only STATE emblems are visible.

         Province and burg emblems are hidden.
      */

      setDisplay(
        "stateEmblems",
        true
      );

      setDisplay(
        "provinceEmblems",
        false
      );

      setDisplay(
        "burgEmblems",
        false
      );


      /*
         Remove Azgaar's white burg circles
         and port anchors.
      */

      setDisplay(
        "burgIcons",
        false
      );


      /*
         Large political labels.
      */

      setDisplay(
        "labels-state",
        true
      );

      setDisplay(
        "labels-province",
        true
      );

      setDisplay(
        "labels-capital",
        true
      );


      /*
         Smaller settlement labels begin hidden.
      */

      setDisplay(
        "labels-city",
        false
      );

      setDisplay(
        "labels-town",
        false
      );

      setDisplay(
        "labels-fort",
        false
      );

      setDisplay(
        "labels-village",
        false
      );


      /*
         Fit map to screen.
      */

      resize();

      resetView();


      status.textContent =
        "Zoom out = political map • zoom in = settlement detail";


    } catch (error) {

      console.error(error);


      status.textContent =
        "Map loaded, but layer controls could not be initialized.";
    }
  }
);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  resize
);

})();

</script>

</body>
</html>
