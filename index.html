<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Caelora — Interactive Map</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}


/* =========================================================
   MAP VIEWPORT
   ========================================================= */

#viewport {

  position: fixed;

  inset: 0;

  overflow: hidden;

  cursor: grab;

  touch-action: none;

  background: #111;

  /*
     Prevent unnecessary browser rendering work outside
     the visible map area.
  */

  contain: strict;
}

#viewport.dragging {
  cursor: grabbing;
}


/*
   The SVG is purely visual.

   pointer-events:none is important because it allows
   the parent viewport to receive the mouse wheel and
   dragging events.
*/

#mapObject {

  position: absolute;

  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  transform-origin: 0 0;

  user-select: none;

  -webkit-user-drag: none;

  pointer-events: none;

  /*
     Tell the browser this element is going to be
     transformed frequently.
  */

  will-change: transform;
}


/* =========================================================
   CAELORA TITLE
   ========================================================= */

#title {

  position: fixed;

  z-index: 30;

  top: 18px;
  left: 22px;

  pointer-events: none;

  color: #eee;

  /*
     Fantasy / medieval-style font stack.

     Cinzel is used if available; the fallbacks ensure
     the title still looks appropriate if it isn't installed.
  */

  font-family:
    "Cinzel Decorative",
    "Cinzel",
    "Trajan Pro",
    "Times New Roman",
    Georgia,
    serif;

  font-size: 27px;

  font-weight: 600;

  letter-spacing: 2.5px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9),
    0 0 10px rgba(0,0,0,.65);

  white-space: nowrap;

  opacity: .95;
}

#title .year {

  font-size: .72em;

  letter-spacing: 2px;

  margin-left: 5px;

  opacity: .88;
}


/* =========================================================
   CONTROLS
   ========================================================= */

#controls {

  position: fixed;

  z-index: 30;

  top: 14px;
  right: 14px;

  display: flex;

  gap: 5px;

  padding: 5px;

  border-radius: 7px;

  /*
     DARK UI
  */

  background: rgba(18,18,18,.92);

  border: 1px solid rgba(255,255,255,.14);

  box-shadow:
    0 3px 12px rgba(0,0,0,.45);

  backdrop-filter: blur(5px);
}

button {

  width: 38px;
  height: 34px;

  border: 1px solid rgba(255,255,255,.10);

  border-radius: 5px;

  background: #242424;

  color: #eee;

  font-size: 19px;

  line-height: 1;

  cursor: pointer;

  transition:
    background .12s ease,
    border-color .12s ease;
}

button:hover {

  background: #333;

  border-color:
    rgba(255,255,255,.22);
}

button:active {
  background: #181818;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {

  position: fixed;

  z-index: 30;

  left: 14px;
  bottom: 14px;

  padding: 5px 8px;

  border-radius: 5px;

  color: #ddd;

  background: rgba(18,18,18,.68);

  border: 1px solid
    rgba(255,255,255,.08);

  font: 12px/1.2 system-ui, sans-serif;

  pointer-events: none;

  opacity: .82;
}

</style>
</head>


<body>


<!-- =======================================================
     MAP
     ======================================================= -->

<div id="viewport">

  <object
    id="mapObject"
    data="caelora.svg"
    type="image/svg+xml">
  </object>

</div>


<!-- =======================================================
     TITLE
     ======================================================= -->

<div id="title">
  Caelora <span class="year">1246 S.C.</span>
</div>


<!-- =======================================================
     CONTROLS
     ======================================================= -->

<div id="controls">

  <button
    id="zoomOut"
    title="Zoom out">
    −
  </button>

  <button
    id="reset"
    title="Reset view">
    ⌂
  </button>

  <button
    id="zoomIn"
    title="Zoom in">
    +
  </button>

</div>


<div id="status">
  Loading map…
</div>


<script>

(() => {

"use strict";


/* =========================================================
   MAP DIMENSIONS
   ========================================================= */

const SVG_W = 1920;
const SVG_H = 1080;


/* =========================================================
   ELEMENT REFERENCES
   ========================================================= */

const viewport =
  document.getElementById("viewport");

const mapObject =
  document.getElementById("mapObject");

const status =
  document.getElementById("status");


/* =========================================================
   VIEW STATE
   ========================================================= */

let svg = null;

let scale = 1;

let minScale = 1;

let x = 0;

let y = 0;


/* =========================================================
   INPUT STATE
   ========================================================= */

let dragging = false;

let lastX = 0;

let lastY = 0;

let pinchDistance = null;


/* =========================================================
   PERFORMANCE STATE
   ========================================================= */

let raf = 0;

let lastDetailState = "";


/* =========================================================
   DETAIL THRESHOLDS
   =========================================================

   Minimum zoom:
     STATE EMBLEMS ONLY

   Zoom in:
     Province emblems
     City labels
     Burg shields
     Town labels
     Fort labels
     Village labels

   The thresholds are deliberately spread out so the map
   doesn't suddenly become overloaded with detail.
*/

const DETAIL = {

  provinceEmblems: 1.25,

  cityLabels: 1.65,

  burgEmblems1: 1.45,

  townLabels: 1.90,

  fortLabels: 2.20,

  villageLabels: 2.55,

  burgEmblems2: 1.90,

  burgEmblems3: 2.45,

  burgEmblems4: 3.00

};


/* =========================================================
   BURG ELEMENT CACHE
   ========================================================= */

let burgUses = [];


/* =========================================================
   CLAMP
   ========================================================= */

function clamp(
  value,
  minimum,
  maximum
) {

  return Math.max(
    minimum,
    Math.min(
      maximum,
      value
    )
  );
}


/* =========================================================
   FIND SVG GROUP
   ========================================================= */

function getGroup(id) {

  if (!svg) {
    return null;
  }

  return svg.getElementById(id);
}


/* =========================================================
   DISPLAY CONTROL
   ========================================================= */

function setDisplay(
  id,
  visible
) {

  const element =
    getGroup(id);

  if (!element) {
    return;
  }

  element.style.display =
    visible ? "" : "none";
}


/* =========================================================
   CACHE BURG SHIELDS
   =========================================================

   This search happens ONCE.

   We don't repeatedly search the 32 MB SVG during zooming.
*/

function cacheBurgUses() {

  const group =
    getGroup("burgEmblems");

  if (!group) {

    burgUses = [];

    return;
  }


  burgUses =
    Array.from(
      group.querySelectorAll(
        ":scope > use"
      )
    );
}


/* =========================================================
   BURG SHIELD VISIBILITY
   ========================================================= */

function showBurgFraction(
  fraction
) {

  if (!burgUses.length) {
    return;
  }


  const count =
    Math.ceil(
      burgUses.length *
      fraction
    );


  for (
    let i = 0;
    i < burgUses.length;
    i++
  ) {

    burgUses[i].style.display =
      i < count
        ? ""
        : "none";
  }
}


/* =========================================================
   UPDATE DETAIL LAYERS
   ========================================================= */

function updateDetailLayers() {

  if (!svg) {
    return;
  }


  const s = scale;


  /*
     Determine the current detail tier.

     We only modify the SVG when moving between tiers.
  */

  let detailState;


  if (
    s <
    DETAIL.burgEmblems1
  ) {

    detailState = "minimum";

  } else if (
    s <
    DETAIL.burgEmblems2
  ) {

    detailState = "low";

  } else if (
    s <
    DETAIL.burgEmblems3
  ) {

    detailState = "medium";

  } else if (
    s <
    DETAIL.burgEmblems4
  ) {

    detailState = "high";

  } else {

    detailState = "maximum";
  }


  /*
     No DOM work if we haven't crossed a threshold.
  */

  if (
    detailState ===
    lastDetailState
  ) {

    return;
  }


  lastDetailState =
    detailState;


  /* =======================================================
     STATE EMBLEMS

     ALWAYS VISIBLE.

     These are the only heraldic emblems visible at
     minimum zoom.
     ======================================================= */

  setDisplay(
    "stateEmblems",
    true
  );


  /* =======================================================
     PROVINCE EMBLEMS

     Hidden at minimum zoom.
     ======================================================= */

  setDisplay(
    "provinceEmblems",
    s >= DETAIL.provinceEmblems
  );


  /* =======================================================
     NORMAL BURG ICONS

     ALWAYS HIDDEN.

     Removes the white circles and port anchors.
     ======================================================= */

  setDisplay(
    "burgIcons",
    false
  );


  /* =======================================================
     LARGE POLITICAL LABELS
     ======================================================= */

  setDisplay(
    "labels-state",
    true
  );

  setDisplay(
    "labels-province",
    true
  );

  setDisplay(
    "labels-capital",
    true
  );


  /* =======================================================
     CITY LABELS
     ======================================================= */

  setDisplay(
    "labels-city",
    s >= DETAIL.cityLabels
  );


  /* =======================================================
     TOWN LABELS
     ======================================================= */

  setDisplay(
    "labels-town",
    s >= DETAIL.townLabels
  );


  /* =======================================================
     FORT LABELS
     ======================================================= */

  setDisplay(
    "labels-fort",
    s >= DETAIL.fortLabels
  );


  /* =======================================================
     VILLAGE LABELS
     ======================================================= */

  setDisplay(
    "labels-village",
    s >= DETAIL.villageLabels
  );


  /* =======================================================
     BURG HERALDRY
     ======================================================= */

  if (
    s <
    DETAIL.burgEmblems1
  ) {

    /*
       No small settlement shields at minimum zoom.
    */

    setDisplay(
      "burgEmblems",
      false
    );

  } else {

    /*
       Enable the actual Azgaar-generated heraldry.
    */

    setDisplay(
      "burgEmblems",
      true
    );


    /*
       Gradually reveal the existing shields.

       Their ORIGINAL SVG size is preserved.
    */

    if (
      s <
      DETAIL.burgEmblems2
    ) {

      showBurgFraction(
        0.20
      );

    } else if (
      s <
      DETAIL.burgEmblems3
    ) {

      showBurgFraction(
        0.50
      );

    } else if (
      s <
      DETAIL.burgEmblems4
    ) {

      showBurgFraction(
        0.80
      );

    } else {

      showBurgFraction(
        1.00
      );
    }
  }
}


/* =========================================================
   REQUEST DETAIL UPDATE
   ========================================================= */

function scheduleDetailUpdate() {

  if (raf) {
    return;
  }


  raf =
    requestAnimationFrame(
      () => {

        raf = 0;

        updateDetailLayers();

        status.textContent =
          `Zoom ${scale.toFixed(2)}×`;
      }
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

  const viewportWidth =
    viewport.clientWidth;

  const viewportHeight =
    viewport.clientHeight;


  minScale =
    Math.min(
      viewportWidth / SVG_W,
      viewportHeight / SVG_H
    );


  if (
    !Number.isFinite(
      minScale
    ) ||
    minScale <= 0
  ) {

    minScale = 0.1;
  }


  scale =
    Math.max(
      scale,
      minScale
    );


  constrain();

  render();
}


/* =========================================================
   MAP BOUNDS
   ========================================================= */

function constrain() {

  const viewportWidth =
    viewport.clientWidth;

  const viewportHeight =
    viewport.clientHeight;


  const mapWidth =
    SVG_W * scale;

  const mapHeight =
    SVG_H * scale;


  if (
    mapWidth <=
    viewportWidth
  ) {

    x =
      (
        viewportWidth -
        mapWidth
      ) / 2;

  } else {

    x =
      clamp(
        x,
        viewportWidth -
          mapWidth,
        0
      );
  }


  if (
    mapHeight <=
    viewportHeight
  ) {

    y =
      (
        viewportHeight -
        mapHeight
      ) / 2;

  } else {

    y =
      clamp(
        y,
        viewportHeight -
          mapHeight,
        0
      );
  }
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  mapObject.style.transform =
    `translate3d(${x}px, ${y}px, 0) scale(${scale})`;


  scheduleDetailUpdate();
}


/* =========================================================
   RESET VIEW
   ========================================================= */

function resetView() {

  scale =
    minScale;


  x =
    (
      viewport.clientWidth -
      SVG_W * scale
    ) / 2;


  y =
    (
      viewport.clientHeight -
      SVG_H * scale
    ) / 2;


  constrain();

  render();
}


/* =========================================================
   ZOOM AROUND POINTER
   ========================================================= */

function zoomAt(
  factor,
  clientX,
  clientY
) {

  const rect =
    viewport.getBoundingClientRect();


  const pointerX =
    clientX -
    rect.left;

  const pointerY =
    clientY -
    rect.top;


  /*
     Map coordinate beneath pointer.
  */

  const mapX =
    (
      pointerX -
      x
    ) / scale;

  const mapY =
    (
      pointerY -
      y
    ) / scale;


  const newScale =
    clamp(
      scale * factor,
      minScale,
      8
    );


  /*
     Keep that map point beneath the cursor.
  */

  x =
    pointerX -
    mapX * newScale;

  y =
    pointerY -
    mapY * newScale;


  scale =
    newScale;


  constrain();

  render();
}


/* =========================================================
   MOUSE WHEEL ZOOM
   ========================================================= */

viewport.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const factor =
      Math.exp(
        -event.deltaY *
        0.0015
      );


    zoomAt(
      factor,
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);


/* =========================================================
   DRAGGING
   ========================================================= */

viewport.addEventListener(
  "pointerdown",
  event => {

    if (
      event.pointerType ===
        "mouse" &&
      event.button !== 0
    ) {

      return;
    }


    dragging = true;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    viewport.classList.add(
      "dragging"
    );


    try {

      viewport.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}
  }
);


viewport.addEventListener(
  "pointermove",
  event => {

    if (!dragging) {
      return;
    }


    x +=
      event.clientX -
      lastX;

    y +=
      event.clientY -
      lastY;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    constrain();

    render();
  }
);


viewport.addEventListener(
  "pointerup",
  event => {

    dragging = false;


    viewport.classList.remove(
      "dragging"
    );


    try {

      viewport.releasePointerCapture(
        event.pointerId
      );

    } catch (_) {}
  }
);


viewport.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

    viewport.classList.remove(
      "dragging"
    );
  }
);


/* =========================================================
   TOUCH PINCH ZOOM
   ========================================================= */

viewport.addEventListener(
  "touchstart",
  event => {

    if (
      event.touches.length === 2
    ) {

      const a =
        event.touches[0];

      const b =
        event.touches[1];


      pinchDistance =
        Math.hypot(
          a.clientX -
            b.clientX,

          a.clientY -
            b.clientY
        );
    }

  },
  {
    passive: true
  }
);


viewport.addEventListener(
  "touchmove",
  event => {

    if (
      event.touches.length !== 2 ||
      pinchDistance === null
    ) {

      return;
    }


    const a =
      event.touches[0];

    const b =
      event.touches[1];


    const distance =
      Math.hypot(
        a.clientX -
          b.clientX,

        a.clientY -
          b.clientY
      );


    const factor =
      distance /
      pinchDistance;


    pinchDistance =
      distance;


    zoomAt(
      factor,

      (
        a.clientX +
        b.clientX
      ) / 2,

      (
        a.clientY +
        b.clientY
      ) / 2
    );

  },
  {
    passive: true
  }
);


viewport.addEventListener(
  "touchend",
  event => {

    if (
      event.touches.length <
      2
    ) {

      pinchDistance =
        null;
    }

  },
  {
    passive: true
  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => {

      zoomAt(
        1.5,

        viewport.clientWidth /
          2,

        viewport.clientHeight /
          2
      );
    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => {

      zoomAt(
        1 / 1.5,

        viewport.clientWidth /
          2,

        viewport.clientHeight /
          2
      );
    }
  );


document
  .getElementById("reset")
  .addEventListener(
    "click",
    resetView
  );


/* =========================================================
   LOAD SVG
   ========================================================= */

mapObject.addEventListener(
  "load",
  () => {

    try {

      svg =
        mapObject
          .contentDocument
          .querySelector("svg");


      if (!svg) {

        throw new Error(
          "SVG root not found"
        );
      }


      /*
         Cache the actual generated burg shields.
      */

      cacheBurgUses();


      /*
         MINIMUM-ZOOM STATE

         Only STATE emblems.

         No province emblems.
         No burg emblems.
         No burg circles.
      */

      setDisplay(
        "stateEmblems",
        true
      );

      setDisplay(
        "provinceEmblems",
        false
      );

      setDisplay(
        "burgEmblems",
        false
      );

      setDisplay(
        "burgIcons",
        false
      );


      /*
         Large labels remain available.
      */

      setDisplay(
        "labels-state",
        true
      );

      setDisplay(
        "labels-province",
        true
      );

      setDisplay(
        "labels-capital",
        true
      );


      /*
         Smaller labels start hidden.
      */

      setDisplay(
        "labels-city",
        false
      );

      setDisplay(
        "labels-town",
        false
      );

      setDisplay(
        "labels-fort",
        false
      );

      setDisplay(
        "labels-village",
        false
      );


      /*
         Fit the map to the screen.
      */

      resize();

      resetView();


      status.textContent =
        "Zoom out = political map • zoom in = settlement detail";


    } catch (error) {

      console.error(error);


      status.textContent =
        "Map loaded, but layer controls could not be initialized.";
    }
  }
);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  resize
);

})();

</script>

</body>
</html>
