<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caelora — World Map</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Georgia, serif;
        }

        #map-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            position: relative;
        }

        #map-container:active {
            cursor: grabbing;
        }

        #map {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: auto;
            transform-origin: 0 0;
            user-select: none;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 5px;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background: rgba(70, 70, 70, 0.95);
        }

        #title {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 10;
            color: white;
            background: rgba(20, 20, 20, 0.8);
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 22px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div id="controls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">−</button>
        <button id="reset">⌂</button>
    </div>

    <div id="title">
        Caelora
    </div>

    <div id="map-container">
        <img id="map" src="./caelora.svg" alt="Map of Caelora">
    </div>

    <script>

        const container = document.getElementById("map-container");
        const map = document.getElementById("map");

        let scale = 1;
        let x = 0;
        let y = 0;

        let dragging = false;
        let startX = 0;
        let startY = 0;

        const MAP_WIDTH = 1920;

        /*
         * Keep the map from becoming smaller than the
         * size of the viewing window.
         */

        function getMinimumScale() {

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const mapHeight = MAP_WIDTH * (1080 / 1920);

            const scaleX = containerWidth / MAP_WIDTH;
            const scaleY = containerHeight / mapHeight;

            return Math.max(scaleX, scaleY);
        }


        /*
         * Keep the map inside the viewing window.
         */

        function constrainPosition() {

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const mapWidth = MAP_WIDTH * scale;
            const mapHeight = (MAP_WIDTH * (1080 / 1920)) * scale;

            /*
             * Horizontal limits
             */

            if (mapWidth <= containerWidth) {

                x = (containerWidth - mapWidth) / 2;

            } else {

                const minX = containerWidth - mapWidth;

                if (x > 0) x = 0;
                if (x < minX) x = minX;

            }


            /*
             * Vertical limits
             */

            if (mapHeight <= containerHeight) {

                y = (containerHeight - mapHeight) / 2;

            } else {

                const minY = containerHeight - mapHeight;

                if (y > 0) y = 0;
                if (y < minY) y = minY;

            }

        }


        function updateMap() {

            const minimumScale = getMinimumScale();

            if (scale < minimumScale) {
                scale = minimumScale;
            }

            constrainPosition();

            map.style.transform =
                `translate(${x}px, ${y}px) scale(${scale})`;

        }


        /*
         * Reset
         */

        function resetMap() {

            scale = getMinimumScale();

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const mapWidth = MAP_WIDTH * scale;
            const mapHeight = (MAP_WIDTH * (1080 / 1920)) * scale;

            x = (containerWidth - mapWidth) / 2;
            y = (containerHeight - mapHeight) / 2;

            updateMap();

        }


        /*
         * Zoom toward a particular screen position
         */

        function zoomAt(screenX, screenY, zoomFactor) {

            const oldScale = scale;

            let newScale = scale * zoomFactor;

            const minimumScale = getMinimumScale();

            if (newScale < minimumScale) {
                newScale = minimumScale;
            }

            if (newScale > 8) {
                newScale = 8;
            }

            if (newScale === oldScale) return;

            /*
             * Find the map coordinate underneath the cursor
             */

            const mapX = (screenX - x) / oldScale;
            const mapY = (screenY - y) / oldScale;

            scale = newScale;

            /*
             * Keep that same point underneath
             * the cursor after zooming
             */

            x = screenX - mapX * scale;
            y = screenY - mapY * scale;

            updateMap();

        }


        /*
         * Zoom buttons
         */

        document.getElementById("zoomIn").addEventListener("click", function () {

            const centerX = container.clientWidth / 2;
            const centerY = container.clientHeight / 2;

            zoomAt(centerX, centerY, 1.25);

        });


        document.getElementById("zoomOut").addEventListener("click", function () {

            const centerX = container.clientWidth / 2;
            const centerY = container.clientHeight / 2;

            zoomAt(centerX, centerY, 0.8);

        });


        /*
         * Reset button
         */

        document.getElementById("reset").addEventListener("click", function () {

            resetMap();

        });


        /*
         * Mouse-wheel zoom
         */

        container.addEventListener("wheel", function (event) {

            event.preventDefault();

            const rect = container.getBoundingClientRect();

            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            if (event.deltaY < 0) {

                zoomAt(mouseX, mouseY, 1.15);

            } else {

                zoomAt(mouseX, mouseY, 0.87);

            }

        }, { passive: false });


        /*
         * Mouse dragging
         */

        container.addEventListener("mousedown", function (event) {

            dragging = true;

            startX = event.clientX - x;
            startY = event.clientY - y;

        });


        window.addEventListener("mouseup", function () {

            dragging = false;

        });


        window.addEventListener("mousemove", function (event) {

            if (!dragging) return;

            x = event.clientX - startX;
            y = event.clientY - startY;

            updateMap();

        });


        /*
         * Touch support
         */

        let touchStartX = 0;
        let touchStartY = 0;

        container.addEventListener("touchstart", function (event) {

            if (event.touches.length !== 1) return;

            touchStartX = event.touches[0].clientX - x;
            touchStartY = event.touches[0].clientY - y;

        });


        container.addEventListener("touchmove", function (event) {

            if (event.touches.length !== 1) return;

            x = event.touches[0].clientX - touchStartX;
            y = event.touches[0].clientY - touchStartY;

            updateMap();

        });


        /*
         * Recalculate everything when the
         * browser window changes size.
         */

        window.addEventListener("resize", function () {

            updateMap();

        });


        /*
         * Wait for the SVG to load before
         * setting the initial position.
         */

        map.addEventListener("load", function () {

            resetMap();

        });

    </script>

</body>
</html>
