<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Caelora — Interactive Map</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#111}#viewport.dragging{cursor:grabbing}#mapObject{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;user-select:none;-webkit-user-drag:none}#controls{position:fixed;z-index:20;top:14px;right:14px;display:flex;gap:6px;padding:6px;border-radius:8px;background:rgba(20,20,20,.78);backdrop-filter:blur(5px)}button{width:38px;height:34px;border:0;border-radius:5px;background:#eee;color:#111;font-size:19px;cursor:pointer}button:hover{background:#fff}#status{position:fixed;z-index:20;left:14px;bottom:14px;padding:5px 8px;border-radius:5px;color:#eee;background:rgba(20,20,20,.68);font:12px/1.2 system-ui,sans-serif;pointer-events:none}</style></head><body><div id="viewport"><object id="mapObject" data="caelora.svg" type="image/svg+xml"></object></div><div id="controls"><button id="zoomOut" title="Zoom out">−</button><button id="reset" title="Reset view">⌂</button><button id="zoomIn" title="Zoom in">+</button></div><div id="status">Loading map…</div><script>
(()=>{"use strict";const W=1920,H=1080,v=document.getElementById("viewport"),o=document.getElementById("mapObject"),st=document.getElementById("status");let svg=null,s=1,minS=1,x=0,y=0,drag=false,lx=0,ly=0,pinch=null,raf=0,last="",burg=[];
const T={city:1.12,b1:1.45,fort:1.40,town:1.75,b2:1.90,village:2.35,b3:2.55,b4:3.10};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),g=id=>svg&&svg.getElementById(id);function disp(id,on){const e=g(id);if(e)e.style.display=on?"":"none"}
function cache(){const e=g("burgEmblems");burg=e?Array.from(e.querySelectorAll(":scope > use")):[]}
function fraction(f){if(!burg.length)return;const n=Math.ceil(burg.length*f);for(let i=0;i<burg.length;i++)burg[i].style.display=i<n?"":"none"}
function layers(){if(!svg)return;const z=s< T.b1?0:s<T.b2?1:s<T.b3?2:s<T.b4?3:4;if(String(z)===last)return;last=String(z);disp("stateEmblems",true);disp("provinceEmblems",true);disp("burgIcons",false);disp("labels-state",true);disp("labels-province",true);disp("labels-capital",true);disp("labels-city",s>=T.city);disp("labels-fort",s>=T.fort);disp("labels-town",s>=T.town);disp("labels-village",s>=T.village);if(s<T.b1)disp("burgEmblems",false);else{disp("burgEmblems",true);if(s<T.b2)fraction(.25);else if(s<T.b3)fraction(.5);else if(s<T.b4)fraction(.8);else fraction(1)}}
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;layers();st.textContent=`Zoom ${s.toFixed(2)}×`})}
function constrain(){const vw=v.clientWidth,vh=v.clientHeight,w=W*s,h=H*s;if(w<=vw)x=(vw-w)/2;else x=clamp(x,vw-w,0);if(h<=vh)y=(vh-h)/2;else y=clamp(y,vh-h,0)}
function render(){o.style.transform=`translate3d(${x}px,${y}px,0) scale(${s})`;schedule()}
function resize(){minS=Math.min(v.clientWidth/W,v.clientHeight/H);if(!isFinite(minS)||minS<=0)minS=.1;s=Math.max(s,minS);constrain();render()}
function reset(){s=minS;x=(v.clientWidth-W*s)/2;y=(v.clientHeight-H*s)/2;constrain();render()}
function zoom(f,cx,cy){const r=v.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,mx=(px-x)/s,my=(py-y)/s,ns=clamp(s*f,minS,8);x=px-mx*ns;y=py-my*ns;s=ns;constrain();render()}
v.addEventListener("wheel",e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
v.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;drag=true;lx=e.clientX;ly=e.clientY;v.classList.add("dragging");try{v.setPointerCapture(e.pointerId)}catch(_){} });
v.addEventListener("pointermove",e=>{if(!drag)return;x+=e.clientX-lx;y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;constrain();render()});v.addEventListener("pointerup",e=>{drag=false;v.classList.remove("dragging");try{v.releasePointerCapture(e.pointerId)}catch(_){} });v.addEventListener("pointercancel",()=>{drag=false;v.classList.remove("dragging")});
v.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});v.addEventListener("touchmove",e=>{if(e.touches.length!==2||pinch===null)return;const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);zoom(d/pinch,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);pinch=d},{passive:true});v.addEventListener("touchend",e=>{if(e.touches.length<2)pinch=null},{passive:true});
document.getElementById("zoomIn").onclick=()=>zoom(1.5,v.clientWidth/2,v.clientHeight/2);document.getElementById("zoomOut").onclick=()=>zoom(1/1.5,v.clientWidth/2,v.clientHeight/2);document.getElementById("reset").onclick=reset;
o.addEventListener("load",()=>{try{svg=o.contentDocument.querySelector("svg");if(!svg)throw Error("SVG root not found");cache();disp("stateEmblems",true);disp("provinceEmblems",true);disp("burgIcons",false);disp("burgEmblems",false);disp("labels-state",true);disp("labels-province",true);disp("labels-capital",true);disp("labels-city",false);disp("labels-fort",false);disp("labels-town",false);disp("labels-village",false);resize();reset();st.textContent="Zoom out = political map • zoom in = settlement detail"}catch(e){console.error(e);st.textContent="Map loaded, but layer controls could not be initialized."}});window.addEventListener("resize",resize);o.addEventListener("dragstart",e=>e.preventDefault())})();
</script></body></html>
