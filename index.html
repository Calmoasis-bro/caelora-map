<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caelora — Interactive Map</title>

<style>

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
    }


    #map-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: grab;
        background: #111;
    }


    #map-container.dragging {
        cursor: grabbing;
    }


    #map {
        position: absolute;
        left: 0;
        top: 0;

        width: 1920px;
        height: 1080px;

        transform-origin: 0 0;

        user-select: none;
        pointer-events: none;

        border: 0;
    }


    #controls {
        position: absolute;
        top: 15px;
        left: 15px;

        z-index: 20;

        display: flex;
        flex-direction: column;

        gap: 6px;
    }


    #controls button {
        width: 42px;
        height: 42px;

        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 6px;

        background: rgba(20,20,20,0.8);
        color: white;

        font-size: 22px;
        cursor: pointer;

        backdrop-filter: blur(4px);
    }


    #controls button:hover {
        background: rgba(60,60,60,0.9);
    }


    #zoom-level {
        position: absolute;
        bottom: 15px;
        left: 15px;

        z-index: 20;

        padding: 6px 10px;

        color: white;
        background: rgba(20,20,20,0.75);

        border-radius: 5px;

        font-size: 13px;

        pointer-events: none;
    }

</style>
</head>


<body>

<div id="map-container">

    <object
        id="map"
        data="caelora.svg"
        type="image/svg+xml">
    </object>


    <div id="controls">

        <button id="zoom-in">+</button>

        <button id="zoom-out">−</button>

        <button id="reset">⌂</button>

    </div>


    <div id="zoom-level">
        100%
    </div>

</div>


<script>


// ============================================================
// BASIC REFERENCES
// ============================================================

const container =
    document.getElementById("map-container");

const map =
    document.getElementById("map");

const zoomText =
    document.getElementById("zoom-level");


// ============================================================
// MAP SIZE
// ============================================================

const MAP_WIDTH = 1920;

const MAP_HEIGHT = 1080;


// ============================================================
// ZOOM SETTINGS
// ============================================================

// Maximum zoom.
//
// This allows extremely close views of individual regions.

const MAX_ZOOM = 12;


// Minimum zoom is calculated automatically.

let MIN_ZOOM = 0.1;


// Current zoom level.

let scale = 1;


// Map position.

let posX = 0;

let posY = 0;


// ============================================================
// DRAGGING
// ============================================================

let dragging = false;

let dragStartX = 0;

let dragStartY = 0;

let startPosX = 0;

let startPosY = 0;


// ============================================================
// SVG DETAIL SETTINGS
// ============================================================
//
// These are the approximate screen sizes we want the
// different settlement symbols to have.
//
// The original Azgaar SVG stores them extremely small.
// We compensate for that here.
//
// ============================================================

const BURG_SETTINGS = {

    village: {
        showAt: 2.0,
        size: 7
    },

    fort: {
        showAt: 1.5,
        size: 9
    },

    town: {
        showAt: 1.7,
        size: 8
    },

    city: {
        showAt: 1.3,
        size: 11
    },

    capital: {
        showAt: 1.1,
        size: 13
    }

};


// ============================================================
// CALCULATE MINIMUM ZOOM
// ============================================================

function calculateMinZoom() {

    const containerWidth =
        container.clientWidth;

    const containerHeight =
        container.clientHeight;


    const scaleX =
        containerWidth / MAP_WIDTH;

    const scaleY =
        containerHeight / MAP_HEIGHT;


    MIN_ZOOM =
        Math.max(scaleX, scaleY);


    // Never allow the map to become excessively small.

    MIN_ZOOM =
        Math.max(MIN_ZOOM, 0.15);
}


// ============================================================
// LIMIT MAP POSITION
// ============================================================

function constrainPosition() {

    const containerWidth =
        container.clientWidth;

    const containerHeight =
        container.clientHeight;


    const scaledWidth =
        MAP_WIDTH * scale;

    const scaledHeight =
        MAP_HEIGHT * scale;


    // Horizontal position

    if (scaledWidth <= containerWidth) {

        posX =
            (containerWidth - scaledWidth) / 2;

    }

    else {

        const minX =
            containerWidth - scaledWidth;


        posX =
            Math.max(
                minX,
                Math.min(posX, 0)
            );
    }


    // Vertical position

    if (scaledHeight <= containerHeight) {

        posY =
            (containerHeight - scaledHeight) / 2;

    }

    else {

        const minY =
            containerHeight - scaledHeight;


        posY =
            Math.max(
                minY,
                Math.min(posY, 0)
            );
    }
}


// ============================================================
// APPLY MAP TRANSFORM
// ============================================================

function updateMap() {

    constrainPosition();


    map.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;


    zoomText.textContent =
        Math.round(scale * 100) + "%";


    updateSVGDetail();
}


// ============================================================
// SVG DETAIL / BURG SYSTEM
// ============================================================

function updateSVGDetail() {

    try {

        const svgDocument =
            map.contentDocument;


        if (!svgDocument) {
            return;
        }


        // ----------------------------------------------------
        // FIND THE ICON SYSTEM
        // ----------------------------------------------------

        const icons =
            svgDocument.getElementById("icons");


        const burgIcons =
            svgDocument.getElementById("burgIcons");


        if (!burgIcons) {
            return;
        }


        // Make sure the general icon layer itself is visible.

        if (icons) {

            icons.style.opacity = "1";
        }


        // ----------------------------------------------------
        // FIND EACH BURG TYPE
        // ----------------------------------------------------

        const village =
            svgDocument.getElementById("village");


        const fort =
            svgDocument.getElementById("fort");


        const town =
            svgDocument.getElementById("town");


        const city =
            svgDocument.getElementById("city");


        const capital =
            svgDocument.getElementById("capital");


        const groups = [

            {
                element: village,
                settings: BURG_SETTINGS.village
            },

            {
                element: fort,
                settings: BURG_SETTINGS.fort
            },

            {
                element: town,
                settings: BURG_SETTINGS.town
            },

            {
                element: city,
                settings: BURG_SETTINGS.city
            },

            {
                element: capital,
                settings: BURG_SETTINGS.capital
            }

        ];


        // ----------------------------------------------------
        // PROCESS EACH BURG TYPE
        // ----------------------------------------------------

        groups.forEach(function(group) {

            if (!group.element) {
                return;
            }


            const settings =
                group.settings;


            // -----------------------------------------------
            // VISIBILITY
            // -----------------------------------------------

            if (scale >= settings.showAt) {

                group.element.style.display =
                    "";

                group.element.style.opacity =
                    "1";

            }

            else {

                group.element.style.display =
                    "none";
            }


            // -----------------------------------------------
            // RESIZE ICONS
            // -----------------------------------------------

            //
            // The actual Azgaar icons are stored as:
            //
            // translate(X,Y) scale(0.07)
            //
            // or:
            //
            // translate(X,Y) scale(0.10)
            //
            // etc.
            //
            // We replace ONLY the scale portion.
            //
            // The translate coordinates are preserved exactly.
            //
            // This means the burg remains at its original
            // geographical position.
            //


            const uses =
                group.element.querySelectorAll("use");


            uses.forEach(function(use) {

                const originalTransform =
                    use.getAttribute(
                        "transform"
                    );


                if (!originalTransform) {
                    return;
                }


                // -------------------------------------------
                // GET ORIGINAL TRANSLATION
                // -------------------------------------------

                const translationMatch =
                    originalTransform.match(
                        /translate\s*\(\s*([^)]+)\s*\)/
                    );


                if (!translationMatch) {
                    return;
                }


                const translation =
                    translationMatch[1];


                // -------------------------------------------
                // CALCULATE NEW INTERNAL SCALE
                // -------------------------------------------
                //
                // A circle/square icon in the SVG is roughly
                // 10 SVG units wide before its tiny Azgaar
                // scale is applied.
                //
                // We calculate the internal scale required
                // to produce the desired number of pixels
                // on the user's screen.
                //
                // Because the whole SVG is already being
                // scaled by "scale", we compensate for that.
                //


                const targetPixels =
                    settings.size;


                const newInternalScale =
                    targetPixels /
                    (10 * scale);


                // -------------------------------------------
                // APPLY NEW TRANSFORM
                // -------------------------------------------

                use.setAttribute(
                    "transform",
                    `translate(${translation}) scale(${newInternalScale})`
                );

            });

        });

    }

    catch (error) {

        console.log(
            "SVG detail update error:",
            error
        );

    }

}


// ============================================================
// ZOOM AROUND A SPECIFIC SCREEN POINT
// ============================================================

function zoomAt(
    screenX,
    screenY,
    newScale
) {

    newScale =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                newScale
            )
        );


    // Convert screen coordinates into map coordinates.

    const mapX =
        (screenX - posX) / scale;

    const mapY =
        (screenY - posY) / scale;


    // Change zoom.

    scale =
        newScale;


    // Keep the point under the cursor.

    posX =
        screenX -
        mapX * scale;


    posY =
        screenY -
        mapY * scale;


    updateMap();
}


// ============================================================
// MOUSE WHEEL ZOOM
// ============================================================

container.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        const rect =
            container.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const zoomFactor =
            event.deltaY < 0
                ? 1.25
                : 0.8;


        zoomAt(
            mouseX,
            mouseY,
            scale * zoomFactor
        );

    },
    {
        passive: false
    }
);


// ============================================================
// MOUSE DRAGGING
// ============================================================

container.addEventListener(
    "mousedown",
    function(event) {

        if (event.button !== 0) {
            return;
        }


        dragging = true;


        container.classList.add(
            "dragging"
        );


        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;


        startPosX =
            posX;

        startPosY =
            posY;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }


        posX =
            startPosX +
            (
                event.clientX -
                dragStartX
            );


        posY =
            startPosY +
            (
                event.clientY -
                dragStartY
            );


        updateMap();

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;


        container.classList.remove(
            "dragging"
        );

    }
);


// ============================================================
// TOUCH SUPPORT
// ============================================================

let touchStartX = 0;

let touchStartY = 0;

let touchStartPosX = 0;

let touchStartPosY = 0;

let lastTouchDistance = null;


// ------------------------------------------------------------
// TOUCH START
// ------------------------------------------------------------

container.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length === 1
        ) {

            const touch =
                event.touches[0];


            touchStartX =
                touch.clientX;

            touchStartY =
                touch.clientY;


            touchStartPosX =
                posX;

            touchStartPosY =
                posY;


            lastTouchDistance =
                null;

        }

        else if (
            event.touches.length === 2
        ) {

            lastTouchDistance =
                getTouchDistance(
                    event.touches
                );
        }

    },
    {
        passive: false
    }
);


// ------------------------------------------------------------
// TOUCH MOVE
// ------------------------------------------------------------

container.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        // ----------------------------------------------------
        // ONE FINGER PAN
        // ----------------------------------------------------

        if (
            event.touches.length === 1
        ) {

            const touch =
                event.touches[0];


            posX =
                touchStartPosX +
                (
                    touch.clientX -
                    touchStartX
                );


            posY =
                touchStartPosY +
                (
                    touch.clientY -
                    touchStartY
                );


            updateMap();

        }


        // ----------------------------------------------------
        // TWO FINGER ZOOM
        // ----------------------------------------------------

        else if (
            event.touches.length === 2
        ) {

            const distance =
                getTouchDistance(
                    event.touches
                );


            if (
                lastTouchDistance !== null
            ) {

                const factor =
                    distance /
                    lastTouchDistance;


                const rect =
                    container.getBoundingClientRect();


                const centerX =
                    (
                        event.touches[0].clientX +
                        event.touches[1].clientX
                    ) / 2 -
                    rect.left;


                const centerY =
                    (
                        event.touches[0].clientY +
                        event.touches[1].clientY
                    ) / 2 -
                    rect.top;


                zoomAt(
                    centerX,
                    centerY,
                    scale * factor
                );

            }


            lastTouchDistance =
                distance;
        }

    },
    {
        passive: false
    }
);


// ------------------------------------------------------------
// TOUCH END
// ------------------------------------------------------------

container.addEventListener(
    "touchend",
    function() {

        lastTouchDistance =
            null;

    },
    {
        passive: false
    }
);


// ------------------------------------------------------------
// TOUCH DISTANCE
// ------------------------------------------------------------

function getTouchDistance(
    touches
) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;


    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


// ============================================================
// ZOOM IN BUTTON
// ============================================================

document.getElementById(
    "zoom-in"
).addEventListener(
    "click",
    function() {

        const centerX =
            container.clientWidth /
            2;


        const centerY =
            container.clientHeight /
            2;


        zoomAt(
            centerX,
            centerY,
            scale * 1.4
        );

    }
);


// ============================================================
// ZOOM OUT BUTTON
// ============================================================

document.getElementById(
    "zoom-out"
).addEventListener(
    "click",
    function() {

        const centerX =
            container.clientWidth /
            2;


        const centerY =
            container.clientHeight /
            2;


        zoomAt(
            centerX,
            centerY,
            scale * 0.7
        );

    }
);


// ============================================================
// RESET / HOME
// ============================================================

document.getElementById(
    "reset"
).addEventListener(
    "click",
    function() {

        calculateMinZoom();


        scale =
            MIN_ZOOM;


        posX = 0;

        posY = 0;


        updateMap();

    }
);


// ============================================================
// WINDOW RESIZE
// ============================================================

window.addEventListener(
    "resize",
    function() {

        calculateMinZoom();


        if (
            scale < MIN_ZOOM
        ) {

            scale =
                MIN_ZOOM;
        }


        updateMap();

    }
);


// ============================================================
// SVG LOAD
// ============================================================

map.addEventListener(
    "load",
    function() {

        calculateMinZoom();


        // Start with the whole world visible.

        scale =
            MIN_ZOOM;


        const containerWidth =
            container.clientWidth;


        const containerHeight =
            container.clientHeight;


        const scaledWidth =
            MAP_WIDTH * scale;


        const scaledHeight =
            MAP_HEIGHT * scale;


        posX =
            (
                containerWidth -
                scaledWidth
            ) / 2;


        posY =
            (
                containerHeight -
                scaledHeight
            ) / 2;


        updateMap();

    }
);


// ============================================================
// INITIAL SETUP
// ============================================================

calculateMinZoom();


</script>

</body>
</html>
